<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Coba Elemen Form di dalam Tabel</title>
  </head>
  <body>
    <h1>Contoh elemen-elemen form pada html</h1>

    <form>
      <table>
        <tr>
          <td><label for="nama">Nama: </label></td>
          <td>
            <input
              type="text"
              name="nama"
              id="nama"
              autocomplete="off" />
          </td>
        </tr>
        <tr>
          <td><label for="password">Password: </label></td>
          <td>
            <input
              type="password"
              name="password"
              id="password" />
          </td>
        </tr>
        <tr>
          <td><label for="email">Email: </label></td>
          <td>
            <input
              type="email"
              name="email"
              id="email"
              autocomplete="off" />
          </td>
        </tr>
        <tr>
          <td><label for="number">Angka: </label></td>
          <td>
            <input
              type="number"
              name="number"
              id="number"
              min="0"
              max="100" />
          </td>
        </tr>
        <tr>
          <td><label for="tanggal">Tanggal: </label></td>
          <td>
            <input
              type="date"
              name="tanggal"
              id="tanggal" />
          </td>
        </tr>
        <tr>
          <td><label for="warna">Warna: </label></td>
          <td>
            <input
              type="color"
              name="warna"
              id="warna" />
          </td>
        </tr>
        <tr>
          <td><label for="file">File: </label></td>
          <td>
            <input
              type="file"
              name="file"
              id="file" />
          </td>
        </tr>
      </table>
      <br />
      <br />
      <button type="submit">Kirim</button>
    </form>
  </body>
</html>
