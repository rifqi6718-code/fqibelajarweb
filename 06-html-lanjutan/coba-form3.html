<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Select & Textarea</title>
  </head>
  <body>
    <h1>Select & Textarea</h1>

    <!-- Select -->
    <form>
      <h3>Pilih Kota:</h3>
      <select
        name="kota"
        id="kota">
        <option>-- Pilih kota Anda --</option>
        <option value="barabai">Barabai</option>
        <option value="balangan">balangan</option>
        <option value="kandangan">kandangan</option>
        <option value="amuntai">Amuntai</option>
        <option value="banjarbaru">Banjarbaru</option>
      </select>
      <br /><br />

      <!-- Textarea -->
      <h3>Masukkan Pesan:</h3>
      <textarea
        name="pesan"
        id="pesan"
        cols="50"
        rows="10"
        placeholder="Tulis pesan Anda di sini..."></textarea>
      <br /><br />
      <button type="submit">Kirim!</button>
    </form>
  </body>
</html>
