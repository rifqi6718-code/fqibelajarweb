<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Coba Elemen Form</title>
  </head>
  <body>
    <h1>Contoh elemen-elemen form pada html</h1>
    <form>
      <!-- form input text -->
      <label for="nama">Nama: </label>
      <input
        type="text"
        name="nama"
        id="nama" />
      <br />
      <!-- form input password -->
      <label for="password">Password: </label>
      <input
        type="password"
        name="password"
        id="password" />
      <br />

      <!-- form input email -->
      <label for="email">Email: </label>
      <input
        type="email"
        name="email"
        id="email" />
      <br />

      <!-- form input number -->
      <label for="number">Angka: </label>
      <input
        type="number"
        name="number"
        id="number"
        min="0"
        max="100" />
      <br />

      <!-- form input tanggal -->
      <label for="tanggal">Tanggal: </label>
      <input
        type="date"
        name="tanggal"
        id="tanggal" />
      <br />

      <!-- form input warna -->
      <label for="warna">Warna: </label>
      <input
        type="color"
        name="warna"
        id="warna" />
      <br />

      <!-- form input file -->
      <label for="file">File: </label>
      <input
        type="file"
        name="file"
        id="file" />
      <br />

      <br />
      <button type="submit">Kirim</button>
    </form>
  </body>
</html>
