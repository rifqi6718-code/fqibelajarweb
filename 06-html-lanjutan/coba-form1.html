<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Coba Elemen Form</title>
  </head>
  <body>
    <h1>Contoh elemen-elemen form pada html</h1>
    <form>
      <!-- form input text -->
      <label for="nama"
        >Nama:
        <input
          type="text"
          name="nama"
          id="nama"
      /></label>
      <br />
      <!-- form input password -->
      <label for="password"
        >Password:
        <input
          type="password"
          name="password"
          id="password"
      /></label>
      <br />

      <!-- form input email -->
      <label for="email"
        >Email:
        <input
          type="email"
          name="email"
          id="email" />
      </label>
      <br />

      <!-- form input number -->
      <label for="number"
        >Angka:
        <input
          type="number"
          name="number"
          id="number"
          min="0"
          max="100" />
      </label>
      <br />

      <!-- form input tanggal -->
      <label for="tanggal"
        >Tanggal:
        <input
          type="date"
          name="tanggal"
          id="tanggal" />
      </label>
      <br />

      <!-- form input warna -->
      <label for="warna"
        >Warna:
        <input
          type="color"
          name="warna"
          id="warna" />
      </label>
      <br />

      <!-- form input file -->
      <label for="file"
        >File:
        <input
          type="file"
          name="file"
          id="file" />
      </label>
      <br />

      <br />
      <button type="submit">Kirim</button>
    </form>
  </body>
</html>
