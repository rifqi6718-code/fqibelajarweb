<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Coba Background</title>
    <style>
      body {
        background-color: rgb(175, 247, 197);
        background-image: linear-gradient(to right, lightgreen, lightblue);
        height: 100vh;
      }
      .kotak1 {
        width: 150px;
        height: 150px;
        background-color: salmon;
        background-image: linear-gradient(to bottom, red, yellow);
      }
      .kotak2 {
        width: 150px;
        height: 150px;
        background-color: salmon;
        background-image: radial-gradient(red, yellow);
      }
      .kotak3 {
        width: 150px;
        height: 150px;
        background-color: salmon;
        background-image: conic-gradient(red, yellow, blue);
      }
    </style>
  </head>
  <body>
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
  </body>
</html>
