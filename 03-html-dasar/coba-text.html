<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Coba Tag Text</title>
  </head>
  <body>
    <!-- <h1> - <h6> untuk judul utama -->
    <h1>Judul 1</h1>
    <h2>Judul 2</h2>
    <h3>Judul 3</h3>
    <h4>Judul 4</h4>
    <h5>Judul 5</h5>
    <h6>Judul 6</h6>

    <!-- <hr> untuk garis horizontal -->
    <hr />

    <!-- <p> untuk paragraf -->
    <p>
      <strong><ins>Hello,</ins></strong
      ><em><del> World!</del></em>
    </p>

    <small>
      <p>H<sub>2</sub>O</p>
      <p>x<sup>2</sup></p>
    </small>
    <!-- <br> untuk pindah baris -->
    <br />
    <br />
    <p>
      Paragraf adalah blok teks yang digunakan untuk menampilkan informasi dalam
      dokumen HTML.
    </p>

    <!-- <blockquote> untuk kutipan -->
    <blockquote><p>This is a blockquote.</p></blockquote>

    <!-- <cite> untuk menyebutkan sumber -->
    <p>
      - John Doe, <cite><mark>Author of the Book</mark></cite>
    </p>
  </body>
</html>
